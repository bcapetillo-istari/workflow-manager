{{- /*
ingress.mode "alb": joins the platform's shared ALB. Same IngressClass ("istari", whose
IngressClassParams carry group "istari"), same frontend host, path /apps/workflows/*. The AWS Load
Balancer Controller merges every Ingress in the group onto one listener and orders rules by path
specificity, so this rule is evaluated before the frontend Ingress's "/*" and no new load balancer,
listener or certificate is created.
ingress.mode "nginx": Prefix path on the frontend host; longest prefix wins over the frontend's "/".
*/ -}}
{{- $svc := include "workflow-manager.fullname" . -}}
{{- if eq .Values.ingress.mode "alb" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}
  labels: {{- include "workflow-manager.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.alb.loadBalancerName | quote }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.alb.certificateArn | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.alb.healthcheckPath | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme | quote }}
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/target-type: ip
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.alb.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.service.port }}
          - path: {{ .Values.ingress.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.service.port }}
{{- else if eq .Values.ingress.mode "nginx" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}
  labels: {{- include "workflow-manager.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.nginx.className }}
  {{- if .Values.ingress.nginx.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.nginx.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
