apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-manager.fullname" . }}
  labels: {{- include "workflow-manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "workflow-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
