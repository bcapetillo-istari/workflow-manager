{{- /* Allow HTTP in on 8080 from any source (ALB targets pods directly with target-type ip);
deny all egress: the pod serves files and never initiates a connection. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workflow-manager.fullname" . }}
  labels: {{- include "workflow-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "workflow-manager.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress: []
{{- end }}
