# Workflow Manager nginx config. Runs as UID 65532 (no `user` directive), listens on 8080,
# read-only root filesystem: only /run and /var/lib/nginx/tmp are written (emptyDir mounts).
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;        # includes "application/json json;"
  default_type application/octet-stream;
  server_tokens off;

  # Temp paths under the single writable volume (Chainguard defaults, made explicit).
  client_body_temp_path /var/lib/nginx/tmp/client_body;
  proxy_temp_path       /var/lib/nginx/tmp/proxy;
  fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
  uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
  scgi_temp_path        /var/lib/nginx/tmp/scgi;

  # Structured access log, one JSON object per line on stdout.
  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"referer":"$http_referer","user_agent":"$http_user_agent","request_time":$request_time}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;              # relative Location header; correct behind any proxy/host

    # Security headers. nginx add_header does not inherit into a location that sets its own
    # add_header, so locations below that add Cache-Control repeat these three lines.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Content-Security-Policy is environment specific (registry API host and object-store bucket
    # hosts must be allowed in connect-src) and so is NOT shipped here. See README "CSP"; example:
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.<domain> https://<bucket>.s3.<region>.amazonaws.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Health for probes and the ALB target group.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Bare prefix -> trailing slash so relative asset URLs resolve.
    location = /apps/workflows { return 301 /apps/workflows/; }

    # Runtime config from the ConfigMap mount, never cached.
    location = /apps/workflows/config.json {
      alias /config/config.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Hashed Vite assets: immutable.
    location /apps/workflows/assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA: real files first, else index.html for client-side routes (/runs/<id>, ...).
    location /apps/workflows/ {
      try_files $uri $uri/ /apps/workflows/index.html;
    }

    # Deny dotfiles anywhere (regex locations win over the prefix locations above).
    location ~ /\. { return 404; }

    # Everything outside the app prefix is not ours.
    location / { return 404; }
  }
}
