[project]
name = "wfm-manifest"
version = "0.1.0"
description = "Validate and publish Workflow Manager manifests against the Istari platform."
readme = "README.md"
authors = [{ name = "Istari Digital", email = "bcapetillo@istaridigital.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
  "jsonschema==4.26.0",
  "pydantic==2.13.5",
  "istari-digital-client==13.0.1",
]

[project.scripts]
wfm-manifest = "wfm_manifest.cli:main"

[tool.poetry]
packages = [{ include = "wfm_manifest" }]

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
mypy = "2.4.0"
ruff = "0.17.2"
types-jsonschema = "4.26.0.20261006"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "BLE", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["wfm_manifest", "tests"]

[[tool.mypy.overrides]]
module = ["istari_digital_client", "istari_digital_client.*"]
ignore_missing_imports = true
